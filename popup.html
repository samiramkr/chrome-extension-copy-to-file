<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save to Google Docs</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img src="icons/icon48.png" alt="Logo" class="logo" />
      <h1>Save to Google Docs</h1>
    </div>

    <!-- Auth Section -->
    <div id="auth-section" class="section">
      <p class="status" id="auth-status">Not connected</p>
      <button id="auth-btn" class="btn btn-primary">Sign in with Google</button>
    </div>

    <!-- Connected Section (hidden by default) -->
    <div id="connected-section" class="section hidden">
      <!-- Current Doc Info -->
      <div id="doc-info" class="doc-info hidden">
        <label>Saving to:</label>
        <p id="doc-title" class="doc-title">—</p>
        <a id="doc-link" href="#" target="_blank" class="doc-link">Open in Google Docs ↗</a>
      </div>

      <!-- Set Target Doc -->
      <div class="input-group">
        <label for="doc-input">Google Doc URL or ID:</label>
        <input
          type="text"
          id="doc-input"
          placeholder="Paste Google Doc URL or document ID"
        />
        <button id="save-doc-btn" class="btn btn-secondary">Connect Doc</button>
      </div>

      <div class="divider"></div>

      <!-- Create New Doc -->
      <div class="input-group">
        <label for="new-doc-title">Or create a new doc:</label>
        <input
          type="text"
          id="new-doc-title"
          placeholder="My Saved Snippets"
        />
        <button id="create-doc-btn" class="btn btn-secondary">Create Doc</button>
      </div>

      <div class="divider"></div>

      <!-- Preferences -->
      <div class="preferences-section">
        <label class="preferences-label">Save Options</label>
        <label class="toggle-option">
          <input type="checkbox" id="toggle-url" checked />
          <span>Include source URL</span>
        </label>
        <label class="toggle-option">
          <input type="checkbox" id="toggle-timestamp" checked />
          <span>Include timestamp</span>
        </label>
      </div>

      <div class="divider"></div>

      <!-- Save Destination -->
      <div class="preferences-section">
        <label class="preferences-label">Save Destination</label>
        <label class="radio-option">
          <input type="radio" name="destination" value="docs" id="dest-docs" checked />
          <span>Google Docs</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="destination" value="local" id="dest-local" />
          <span>Local only</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="destination" value="both" id="dest-both" />
          <span>Both</span>
        </label>
      </div>

      <div class="divider"></div>

      <!-- Keyboard Shortcut -->
      <div class="shortcut-row">
        <div class="shortcut-info">
          <label class="preferences-label">Keyboard Shortcut</label>
          <kbd id="shortcut-keys" class="kbd">⌘+Shift+S</kbd>
        </div>
        <a id="change-shortcut-link" href="#" class="shortcut-link">Change</a>
      </div>

      <div class="divider"></div>

      <!-- Sign Out -->
      <button id="signout-btn" class="btn btn-outline">Sign Out</button>

      <div class="divider"></div>

      <!-- Save History -->
      <div class="history-section">
        <div class="history-header">
          <label>Recent Saves</label>
          <button id="clear-history-btn" class="btn-text">Clear</button>
        </div>
        <div id="history-list" class="history-list">
          <p class="history-empty">No saved snippets yet.</p>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Local Snippets -->
      <div id="local-snippets-section" class="history-section hidden">
        <div class="history-header">
          <label>Local Snippets</label>
          <div class="header-actions">
            <button id="export-snippets-btn" class="btn-text">Export JSON</button>
            <button id="clear-snippets-btn" class="btn-text">Clear</button>
          </div>
        </div>
        <div id="local-snippets-list" class="history-list">
          <p class="history-empty">No local snippets yet.</p>
        </div>
      </div>
    </div>

    <!-- Status Message -->
    <div id="message" class="message hidden"></div>
  </div>

  <script src="utils/google-docs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
